<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papan Pengumuman Kampus</title>
  <style>
    :root {
      --bg: #f5f6f8;
      --surface: #ffffff;
      --text: #1d2330;
      --muted: #667085;
      --border: #e3e6ec;
      --accent: #d71920;
      --accent-dark: #b01218;
      --ok: #1a8a4a;
      --radius: 12px;
      --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 4px 12px rgba(16, 24, 40, .05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #12151c;
        --surface: #1b2029;
        --text: #eef0f4;
        --muted: #9aa3b2;
        --border: #2b3240;
        --shadow: none;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      line-height: 1.5;
    }
    header {
      background: var(--accent);
      color: #fff;
      padding: 28px 16px;
    }
    .wrap { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
    header .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px; }
    header h1 { margin: 0; font-size: 1.6rem; }
    header p { margin: 4px 0 0; opacity: .9; font-size: .95rem; }
    .status {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255, 255, 255, .15);
      padding: 6px 12px; border-radius: 999px; font-size: .85rem;
    }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #ffd166; }
    .status.online .dot { background: #4ade80; }
    .status.offline .dot { background: #fecaca; }

    main { display: grid; grid-template-columns: 340px 1fr; gap: 20px; padding-top: 24px; padding-bottom: 48px; align-items: start; }
    @media (max-width: 820px) { main { grid-template-columns: 1fr; } }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }
    .card h2 { margin: 0 0 14px; font-size: 1.1rem; }

    label { display: block; font-size: .85rem; font-weight: 600; margin: 12px 0 4px; }
    input, select, textarea {
      width: 100%; padding: 9px 11px; font: inherit; color: inherit;
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    textarea { min-height: 110px; resize: vertical; }
    button {
      font: inherit; cursor: pointer; border: 0; border-radius: 8px; padding: 10px 14px; font-weight: 600;
    }
    .btn-primary { width: 100%; margin-top: 16px; background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-dark); }
    .btn-primary:disabled { opacity: .6; cursor: wait; }
    .btn-delete { background: transparent; color: var(--accent); border: 1px solid var(--border); padding: 6px 10px; font-size: .85rem; }
    .btn-delete:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .toolbar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
    .toolbar h2 { margin: 0; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .chip {
      background: var(--surface); color: var(--muted); border: 1px solid var(--border);
      padding: 5px 12px; border-radius: 999px; font-size: .85rem; font-weight: 500;
    }
    .chip.active { background: var(--text); color: var(--bg); border-color: var(--text); }

    .list { display: grid; gap: 12px; }
    .item { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
    .item-top { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .item h3 { margin: 6px 0 0; font-size: 1.05rem; }
    .badge {
      display: inline-block; font-size: .72rem; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
      padding: 2px 9px; border-radius: 999px; background: #eef2ff; color: #3b4bb8;
    }
    .badge[data-cat="Akademik"]  { background: #e6f4ff; color: #0b64b8; }
    .badge[data-cat="Ormawa"]    { background: #fff1e6; color: #b85a0b; }
    .badge[data-cat="Kegiatan"]  { background: #e8f8ee; color: #1a7a43; }
    .badge[data-cat="Beasiswa"]  { background: #f6ebff; color: #7a2db8; }
    .badge[data-cat="Umum"]      { background: #eef0f4; color: #4a5568; }
    .item p { margin: 10px 0; white-space: pre-wrap; word-break: break-word; }
    .meta { font-size: .82rem; color: var(--muted); }

    .empty, .error-box { text-align: center; padding: 32px 16px; color: var(--muted); border: 1px dashed var(--border); border-radius: var(--radius); }
    .error-box { color: var(--accent); border-color: var(--accent); }

    #toast {
      position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
      background: var(--text); color: var(--bg); padding: 10px 18px; border-radius: 8px;
      opacity: 0; pointer-events: none; transition: .25s; font-size: .9rem; max-width: 90vw;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.error { background: var(--accent); color: #fff; }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <div>
        <h1>Papan Pengumuman Kampus</h1>
        <p>Informasi perkuliahan &amp; kegiatan Ormawa dalam satu tempat</p>
      </div>
      <div id="status" class="status"><span class="dot"></span><span id="status-text">Memeriksa backend…</span></div>
    </div>
  </header>

  <main class="wrap">
    <section class="card">
      <h2>Tambah Pengumuman</h2>
      <form id="form" autocomplete="off">
        <label for="title">Judul</label>
        <input id="title" name="title" maxlength="120" required placeholder="Contoh: Jadwal UTS Cloud Computing">

        <label for="category">Kategori</label>
        <select id="category" name="category">
          <option>Umum</option>
          <option>Akademik</option>
          <option>Ormawa</option>
          <option>Kegiatan</option>
          <option>Beasiswa</option>
        </select>

        <label for="author">Penulis</label>
        <input id="author" name="author" maxlength="60" placeholder="Admin">

        <label for="content">Isi pengumuman</label>
        <textarea id="content" name="content" maxlength="2000" required placeholder="Tulis detail pengumuman di sini…"></textarea>

        <button id="submit" class="btn-primary" type="submit">Publikasikan</button>
      </form>
    </section>

    <section>
      <div class="toolbar">
        <h2>Daftar Pengumuman <span id="count" class="meta"></span></h2>
        <button id="refresh" class="chip" type="button">Muat ulang</button>
      </div>
      <div id="chips" class="chips"></div>
      <div id="list" class="list"></div>
    </section>
  </main>

  <div id="toast" role="status"></div>

  <script>
    // Nginx meneruskan /api/* ke service "backend" lewat jaringan app-net.
    const API = "/api";
    const CATEGORIES = ["Semua", "Umum", "Akademik", "Ormawa", "Kegiatan", "Beasiswa"];

    let items = [];
    let activeFilter = "Semua";

    const $ = (id) => document.getElementById(id);

    async function request(path, options) {
      const res = await fetch(API + path, options);
      let data = null;
      try { data = await res.json(); } catch (_) { /* respons tanpa body JSON */ }
      if (!res.ok) throw new Error((data && data.error) || "Permintaan gagal (HTTP " + res.status + ")");
      return data;
    }

    function toast(message, isError) {
      const el = $("toast");
      el.textContent = message;
      el.className = "show" + (isError ? " error" : "");
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => { el.className = ""; }, 2800);
    }

    function formatDate(iso) {
      const d = new Date(iso);
      if (isNaN(d)) return "";
      return d.toLocaleString("id-ID", { dateStyle: "medium", timeStyle: "short" });
    }

    function renderChips() {
      const box = $("chips");
      box.replaceChildren();
      CATEGORIES.forEach((cat) => {
        const b = document.createElement("button");
        b.type = "button";
        b.className = "chip" + (cat === activeFilter ? " active" : "");
        b.textContent = cat;
        b.addEventListener("click", () => { activeFilter = cat; renderChips(); renderList(); });
        box.appendChild(b);
      });
    }

    function renderList() {
      const list = $("list");
      list.replaceChildren();

      // Simpan index asli dari backend, karena DELETE memakai ?index=X
      const visible = items
        .map((item, index) => ({ item, index }))
        .filter(({ item }) => activeFilter === "Semua" || item.category === activeFilter)
        .reverse(); // terbaru di atas

      $("count").textContent = "(" + visible.length + ")";

      if (visible.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Belum ada pengumuman.";
        list.appendChild(empty);
        return;
      }

      visible.forEach(({ item, index }) => {
        const card = document.createElement("article");
        card.className = "item";

        const top = document.createElement("div");
        top.className = "item-top";

        const head = document.createElement("div");
        const badge = document.createElement("span");
        badge.className = "badge";
        badge.dataset.cat = item.category;
        badge.textContent = item.category;
        const title = document.createElement("h3");
        title.textContent = item.title;
        head.append(badge, title);

        const del = document.createElement("button");
        del.type = "button";
        del.className = "btn-delete";
        del.textContent = "Hapus";
        del.addEventListener("click", () => removeItem(index, item.title));

        top.append(head, del);

        const body = document.createElement("p");
        body.textContent = item.content;

        const meta = document.createElement("div");
        meta.className = "meta";
        meta.textContent = item.author + " · " + formatDate(item.created_at);

        card.append(top, body, meta);
        list.appendChild(card);
      });
    }

    async function loadItems() {
      try {
        items = await request("/announcements");
        renderList();
      } catch (err) {
        const list = $("list");
        list.replaceChildren();
        const box = document.createElement("div");
        box.className = "error-box";
        box.textContent = "Gagal memuat pengumuman: " + err.message;
        list.appendChild(box);
      }
    }

    async function checkHealth() {
      const el = $("status");
      try {
        await request("/health");
        el.className = "status online";
        $("status-text").textContent = "Backend online";
      } catch (_) {
        el.className = "status offline";
        $("status-text").textContent = "Backend offline";
      }
    }

    async function removeItem(index, title) {
      if (!confirm('Hapus pengumuman "' + title + '"?')) return;
      try {
        await request("/announcements?index=" + index, { method: "DELETE" });
        toast("Pengumuman dihapus");
        await loadItems();
      } catch (err) {
        toast(err.message, true);
        await loadItems();
      }
    }

    $("form").addEventListener("submit", async (event) => {
      event.preventDefault();
      const btn = $("submit");
      btn.disabled = true;
      const payload = {
        title: $("title").value,
        category: $("category").value,
        author: $("author").value,
        content: $("content").value
      };
      try {
        await request("/announcements", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        event.target.reset();
        toast("Pengumuman dipublikasikan");
        await loadItems();
      } catch (err) {
        toast(err.message, true);
      } finally {
        btn.disabled = false;
      }
    });

    $("refresh").addEventListener("click", () => { loadItems(); checkHealth(); });

    renderChips();
    loadItems();
    checkHealth();
    // Sinkronisasi otomatis supaya perubahan dari pengguna lain ikut tampil
    setInterval(() => { loadItems(); checkHealth(); }, 15000);
  </script>
</body>
</html>
