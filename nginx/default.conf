server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS internal Docker. Nama "backend" di-resolve ulang setiap beberapa detik,
    # jadi saat container backend dihapus lalu dibuat lagi (IP berubah),
    # Nginx tetap menemukan backend tanpa perlu di-restart.
    resolver 127.0.0.11 valid=5s ipv6=off;

    # /api/xyz  ->  http://backend:8000/xyz   (lewat jaringan app-net)
    location /api/ {
        set $backend_upstream http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Supaya perubahan index.html (bind mount) langsung terlihat di browser
        add_header Cache-Control "no-cache";
    }
}
